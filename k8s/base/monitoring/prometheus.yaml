apiVersion: v1
kind: ConfigMap
metadata:
  name: flowist-prometheus-config
  labels:
    app.kubernetes.io/name: flowist-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: service

      - job_name: rabbitmq
        metrics_path: /metrics
        static_configs:
          - targets:
              - flowist-rabbitmq:15692
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowist-prometheus-rules
  labels:
    app.kubernetes.io/name: flowist-prometheus
data:
  flowist-alerts.yml: |
    groups:
      - name: flowist-http
        rules:
          - alert: FlowistHighErrorRate
            expr: sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count[5m])) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Flowist service error rate is above 5%.
          - alert: FlowistHighLatency
            expr: histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service)) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Flowist p95 latency is above 1 second.
          - alert: FlowistRabbitMqConsumerBacklog
            expr: rabbitmq_queue_messages_ready > 100
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: RabbitMQ queue backlog is growing.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowist-prometheus
  labels:
    app.kubernetes.io/name: flowist-prometheus
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowist-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowist-prometheus
        app.kubernetes.io/component: monitoring
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.0.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prometheus-rules
              mountPath: /etc/prometheus/rules
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: prometheus-config
          configMap:
            name: flowist-prometheus-config
        - name: prometheus-rules
          configMap:
            name: flowist-prometheus-rules
---
apiVersion: v1
kind: Service
metadata:
  name: flowist-prometheus
  labels:
    app.kubernetes.io/name: flowist-prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flowist-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
