apiVersion: v1
kind: Secret
metadata:
  name: flowist-grafana-secrets
  labels:
    app.kubernetes.io/name: flowist-grafana
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: CHANGE_ME_GRAFANA_PASSWORD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowist-grafana-provisioning
  labels:
    app.kubernetes.io/name: flowist-grafana
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://flowist-prometheus:9090
        isDefault: true
      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: http://flowist-elasticsearch:9200
        database: flowist-*
        jsonData:
          timeField: "@timestamp"
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: Flowist
        folder: Flowist
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowist-grafana-dashboards
  labels:
    app.kubernetes.io/name: flowist-grafana
data:
  flowist-overview.json: |
    {
      "title": "Flowist Overview",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "type": "timeseries",
          "title": "Request Count",
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count[5m])) by (service)"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
        },
        {
          "type": "timeseries",
          "title": "Error Rate",
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[5m])) by (service)"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 }
        },
        {
          "type": "timeseries",
          "title": "p95 Duration",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service))"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 }
        },
        {
          "type": "timeseries",
          "title": "RabbitMQ Ready Messages",
          "targets": [
            {
              "expr": "rabbitmq_queue_messages_ready"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 }
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowist-grafana-alerting
  labels:
    app.kubernetes.io/name: flowist-grafana
data:
  contact-points.yml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: flowist-email
        receivers:
          - uid: flowist-email
            type: email
            settings:
              addresses: ops@flowist.local
      - orgId: 1
        name: flowist-slack
        receivers:
          - uid: flowist-slack
            type: slack
            settings:
              url: CHANGE_ME_SLACK_WEBHOOK
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowist-grafana
  labels:
    app.kubernetes.io/name: flowist-grafana
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowist-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowist-grafana
        app.kubernetes.io/component: monitoring
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: flowist-grafana-secrets
          volumeMounts:
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: grafana-alerting
              mountPath: /etc/grafana/provisioning/alerting/contact-points.yml
              subPath: contact-points.yml
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: grafana-provisioning
          configMap:
            name: flowist-grafana-provisioning
        - name: grafana-alerting
          configMap:
            name: flowist-grafana-alerting
        - name: grafana-dashboards
          configMap:
            name: flowist-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: flowist-grafana
  labels:
    app.kubernetes.io/name: flowist-grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flowist-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
