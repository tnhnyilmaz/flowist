apiVersion: v1
kind: Service
metadata:
  name: flowist-rabbitmq
  labels:
    app.kubernetes.io/name: flowist-rabbitmq
    app.kubernetes.io/component: messaging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flowist-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
    - name: metrics
      port: 15692
      targetPort: metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowist-rabbitmq-enabled-plugins
  labels:
    app.kubernetes.io/name: flowist-rabbitmq
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flowist-rabbitmq
  labels:
    app.kubernetes.io/name: flowist-rabbitmq
    app.kubernetes.io/component: messaging
spec:
  serviceName: flowist-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowist-rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowist-rabbitmq
        app.kubernetes.io/component: messaging
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: metrics
              containerPort: 15692
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                configMapKeyRef:
                  name: flowist-common-config
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: flowist-app-secrets
                  key: RABBITMQ_PASSWORD
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-enabled-plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - ping
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: rabbitmq-enabled-plugins
          configMap:
            name: flowist-rabbitmq-enabled-plugins
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
