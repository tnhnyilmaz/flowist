apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flowist-elasticsearch
  labels:
    app.kubernetes.io/name: flowist-elasticsearch
    app.kubernetes.io/component: search
spec:
  serviceName: flowist-elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowist-elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowist-elasticsearch
        app.kubernetes.io/component: search
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.14
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: -Xms512m -Xmx512m
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: flowist-elasticsearch
  labels:
    app.kubernetes.io/name: flowist-elasticsearch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flowist-elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
