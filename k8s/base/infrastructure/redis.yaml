apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowist-redis
  labels:
    app.kubernetes.io/name: flowist-redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowist-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowist-redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:8
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flowist-redis
  labels:
    app.kubernetes.io/name: flowist-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flowist-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
