apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowist-seq
  labels:
    app.kubernetes.io/name: flowist-seq
    app.kubernetes.io/component: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowist-seq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowist-seq
        app.kubernetes.io/component: logging
    spec:
      containers:
        - name: seq
          image: datalust/seq:latest
          ports:
            - name: http
              containerPort: 80
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SEQ_FIRSTRUN_NOAUTHENTICATION
              value: "true"
          volumeMounts:
            - name: seq-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: seq-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flowist-seq
  labels:
    app.kubernetes.io/name: flowist-seq
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flowist-seq
  ports:
    - name: http
      port: 80
      targetPort: http
