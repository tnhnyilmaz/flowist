apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowist-default-deny-ingress
  labels:
    app.kubernetes.io/name: flowist
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowist-allow-monitoring-scrape
  labels:
    app.kubernetes.io/name: flowist
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flowist-prometheus
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15692
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowist-allow-ingress-to-gateway
  labels:
    app.kubernetes.io/name: flowist-apigateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flowist-apigateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowist-allow-gateway-to-services
  labels:
    app.kubernetes.io/name: flowist
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - flowist-authservice
          - flowist-taskservice
          - flowist-notificationservice
          - flowist-activityservice
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flowist-apigateway
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowist-allow-services-to-infrastructure
  labels:
    app.kubernetes.io/name: flowist
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - database
          - messaging
          - cache
          - logging
          - search
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - backend
                  - gateway
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 9200
